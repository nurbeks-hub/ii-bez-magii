<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Закрытая страница</title>
<style>
:root{--bg:#fff;--ink:#111;--ink-3:#888;--line:#e4e4e4;--err:#c62828}
@media (prefers-color-scheme: dark){:root{--bg:#111;--ink:#eee;--ink-3:#888;--line:#333;--err:#ef6b6b}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,Inter,sans-serif}
.w{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px}
h1{font-size:17px;font-weight:600;margin:0 0 4px}
input,button{font:inherit;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{background:var(--ink);color:var(--bg);border:0;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#m{min-height:20px;font-size:13px;color:var(--ink-3)}#m.e{color:var(--err)}
</style></head><body><div class="w"><form id="f" action="javascript:void 0" onsubmit="return false">
<h1>Закрытая страница</h1>

<button id="b" type="submit">Открыть</button><div id="m"></div>
</form></div>
